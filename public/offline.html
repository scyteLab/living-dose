<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF8F3" />
    <title>You're offline | Living Dose</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF8F3; color: #1E3318; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      main { max-width: 420px; padding: 32px 24px; text-align: center; }
      img { width: 64px; height: 70px; }
      h1 { margin: 20px 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; line-height: 1.6; color: #5B6655; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #7CAF42; color: #1E3318; font-size: 16px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>Check your mobile data or Wi-Fi and try again. Your meal plan, diary and saved information are safe on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
